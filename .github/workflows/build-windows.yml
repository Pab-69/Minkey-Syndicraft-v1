name: Build installeur Windows

on:
  push:
    branches:
      - main
      - "claude/**"
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # GitHub exige que le tag existe deja pour pouvoir publier une release
      # directement (pas en brouillon) : on le cree/pousse avant le build.
      # On cree aussi la Release GitHub elle-meme a l'avance : sinon
      # electron-builder tente de la creer depuis deux uploads en parallele
      # (le .exe et son .blockmap), ce qui provoque une race condition ou
      # l'un des deux echoue avec "already_exists" et son fichier (parfois
      # le .exe lui-meme) n'est jamais mis en ligne.
      - name: Cree le tag et la Release GitHub (sur main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION" 2>/dev/null || echo "Tag v$VERSION deja existant"
          git push origin "v$VERSION" 2>/dev/null || echo "Tag v$VERSION deja pousse"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION deja existante"
          else
            gh release create "v$VERSION" --title "$VERSION" --notes "v$VERSION" --target main
          fi

      # Sur `main`, publie automatiquement une Release GitHub (lien stable
      # .../releases/latest) avec le GITHUB_TOKEN fourni par Actions, pour
      # que le launcher puisse detecter les mises a jour de lui-meme.
      # Sur les autres branches, on build seulement (pas de publication).
      - name: Build (et publie sur main)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npm run dist:win -- --publish always
          else
            npm run dist:win -- --publish never
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MinkeySyndicraftLauncher-Setup
          path: release/*.exe
          retention-days: 30
